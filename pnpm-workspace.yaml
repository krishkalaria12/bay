packages:
  - apps/*
  - packages/*
  # The landing page is a standalone Astro site with its own lockfile (apps/web).
  - "!apps/web"
  # The CLI is a standalone Bun tool (apps/cli).
  - "!apps/cli"

# React Native + CocoaPods expect a flat node_modules (the Podfile and Metro
# resolve react-native-macos by path), so hoist instead of pnpm's symlink store.
nodeLinker: hoisted

# Peers are listed explicitly: an auto-installed one could be a package with no
# react-native-macos build (Reanimated 4, say).
autoInstallPeers: false

# Fixes in dependencies, applied by every `pnpm install`.
patchedDependencies:
  expo-constants@18.0.14: patches/expo-constants@18.0.14.patch
  expo-modules-core@3.0.30: patches/expo-modules-core@3.0.30.patch
  react-native-macos@0.81.9: patches/react-native-macos@0.81.9.patch
