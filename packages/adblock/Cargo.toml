[package]
name = "bay-adblock"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bay's content blocker: Brave's adblock-rust behind a C ABI and JNI, shared by the desktop and mobile engines."

[lib]
# A Rust library only: the desktops link it through bay-desktop and the mobile core into its own library (one Rust
# artifact per app, plan D16). Whoever wants a C library asks for one (`cargo rustc --lib --crate-type staticlib` or
# `cdylib`, as scripts/adblock and the bench do), so building bay-desktop doesn't link a cdylib nobody uses.
crate-type = ["lib"]

[dependencies]
adblock = { version = "0.13.5", features = ["content-blocking", "debug-info", "css-validation"] }
base64 = "0.22"
ego-tree = "0.11"
encoding_rs = "0.8"
fancy-regex = "0.20"
percent-encoding = "2"
psl = "2"
regex = "1"
regress = "0.12"
scraper = { version = "0.29", default-features = false, features = ["errors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

# adblock-rust with one change: vendor/README.md.
[patch.crates-io]
adblock = { path = "vendor/adblock" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
