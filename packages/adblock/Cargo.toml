[package]
name = "bay-adblock"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bay's content blocker: Brave's adblock-rust behind a C ABI and JNI, shared by the desktop and mobile engines."

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
adblock = { version = "0.13.5", features = ["content-blocking", "debug-info", "css-validation"] }
base64 = "0.22"
ego-tree = "0.11"
encoding_rs = "0.8"
fancy-regex = "0.20"
percent-encoding = "2"
psl = "2"
regex = "1"
regress = "0.12"
scraper = { version = "0.29", default-features = false, features = ["errors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
