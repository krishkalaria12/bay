[package]
name = "gpui_platform"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
path = "src/gpui_platform.rs"
doctest = false

[features]
default = ["multithreaded"]
# Threads in the browser: needs a nightly toolchain and a cross-origin-isolated
# page. Off, gpui_web builds on stable.
multithreaded = ["gpui_web/multithreaded"]
bench-support = ["gpui/bench-support", "gpui_macos/bench-support", "gpui_wgpu/bench-support"]
font-kit = ["gpui_macos/font-kit"]
inspector = ["gpui/inspector"]
test-support = ["gpui/test-support", "gpui_macos/test-support", "gpui_windows/test-support", "gpui_wgpu/test-support"]
screen-capture = ["gpui/screen-capture", "gpui_macos/screen-capture", "gpui_windows/screen-capture", "gpui_linux/screen-capture"]
runtime_shaders = ["gpui_macos/runtime_shaders", "gpui_ios/runtime_shaders"]
wayland = ["gpui_linux/wayland"]
x11 = ["gpui_linux/x11"]

[[bench]]
name = "atlas_upload"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "focus_cleanup"
path = "../gpui/benches/focus_cleanup.rs"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "inspector_render"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "randomized_element_tree"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "primitives"
harness = false
required-features = ["bench-support"]

[[test]]
name = "attached_macos"
harness = false

[dependencies]
anyhow = "1.0.86"
gpui = { path = "../gpui", default-features = false }

[dev-dependencies]
bench_metrics = { git = "https://github.com/zed-industries/zed", rev = "a3ce8d5e88e35697b2ba1cf9cb3c6816089b8281" }
criterion = { version = "0.8.2", features = ["html_reports"] }
gpui = { path = "../gpui", default-features = false, features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_macos = { path = "../gpui_macos", default-features = false, features = ["font-kit"] }
objc2 = "0.6"
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGColor", "objc2"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { path = "../gpui_macos", default-features = false }

[target.'cfg(target_os = "ios")'.dependencies]
gpui_ios = { git = "https://github.com/zed-industries/zed", rev = "a3ce8d5e88e35697b2ba1cf9cb3c6816089b8281" }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_windows = { path = "../gpui_windows", default-features = false }
gpui = { path = "../gpui", default-features = false, features = ["windows-manifest"] }

[target.'cfg(all(any(target_os = "linux", target_os = "freebsd"), not(target_env = "ohos")))'.dependencies]
gpui_linux = { path = "../gpui_linux", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_wgpu = { git = "https://github.com/zed-industries/zed", rev = "a3ce8d5e88e35697b2ba1cf9cb3c6816089b8281", optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_web = { git = "https://github.com/zed-industries/zed", rev = "a3ce8d5e88e35697b2ba1cf9cb3c6816089b8281", default-features = false }
console_error_panic_hook = "0.1.7"

[lints.cargo]
missing_lints_inheritance = "allow"
