[package]
name = "bay-state"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The desktop app's state: its model and the documents it saves, read and written as the React Native app does."

[dependencies]
indexmap = { version = "2", features = ["serde"] }
serde.workspace = true
# Settings and fields this build doesn't model keep their order, as the React Native app writes them.
serde_json = { workspace = true, features = ["preserve_order"] }
serde_with = "3"
thiserror = "2"
# Hosts as the TypeScript reads them (`new URL(url).hostname`).
url = "2"
unicode-normalization = "0.1"
# The input rules (addresses, search, URLs) shared with the phones: one Rust copy, not two.
bay-core = { path = "../../mobile-core/crates/bay-core" }

[dev-dependencies]
tempfile.workspace = true
