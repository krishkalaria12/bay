[package]
name = "bay-switches"
version = "0.1.0"
description = "Remote kill switches on the desktops: Bay's signed feed, checked and matched to this release."
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
