[package]
name = "bay-sync"
version = "0.1.0"
description = "Bay's encrypted sync format: a chain's keys, sealed files and the recovery phrase, shared by every desktop."
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
aes-gcm = "0.11"
bip39 = { version = "3", default-features = false, features = ["std"] }
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
qrcodegen = "1.8"
sha2 = "0.11"
zeroize = "1"

[dev-dependencies]
hex = "0.4"
serde_json.workspace = true
