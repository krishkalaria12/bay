[package]
name = "bay-lists"
version = "0.1.0"
description = "The content blocker's filter lists on the desktops: catalogue, settings, list files and the cached engine."
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
bay-adblock.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true

# Windows refuses to replace a mapped file, so the engine is read whole there (files.rs).
[target.'cfg(not(windows))'.dependencies]
memmap2.workspace = true

[dev-dependencies]
tempfile.workspace = true
