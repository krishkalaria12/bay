[package]
name = "bay-engine"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The desktop app's engine: Chromium (NNCore) started, its windows and tabs, and the input routing GPUI needs."

# Its test binary would link Chrome's framework, which loads only from inside an app bundle. Phase 1 puts the engine's
# tests on the stand-in engine (docs/gpui-desktop-plan.html, D12).
[lib]
name = "bay_engine"
test = false
doctest = false

[target.'cfg(target_os = "macos")'.dependencies]
# The host glue compiled in (packages/chromium/ios) calls these crates' C functions.
bay-adblock.workspace = true
bay-lists.workspace = true
bay-plugins.workspace = true
bay-switches.workspace = true

[build-dependencies]
cc = "1"
