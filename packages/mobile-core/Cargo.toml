[workspace]
resolver = "3"
members = ["crates/bay-core", "crates/uniffi-bindgen"]

[workspace.package]
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
uniffi = "0.32.2"
icu_collator = "2.4.0"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
url = "2"
aes-gcm = "0.11"
regex = "1"
fancy-regex = "0.20"
unicode-normalization = "0.1"
ryu-js = "1"
libm = "0.2"
hkdf = "0.13"
hmac = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha2 = "0.11"
x25519-dalek = { version = "3", features = ["static_secrets"] }
bip39 = { version = "3", default-features = false, features = ["std"] }
getrandom = "0.4"
zeroize = "1"
subtle = "2"
hex = "0.4"
async-trait = "0.1"
pollster = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
