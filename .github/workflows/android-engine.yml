name: Android engine
# Builds Bay for Android on GitHub's Linux runners (docs/android-chromium-plan.html): Bay's Chromium engine
# (engine/android, pinned by engine/android/lock.json) as bay-engine.aar for arm64, then the app around it as an APK,
# and publishes both as a prerelease named after the tag. A hosted job ends after six hours, so each engine stage
# compiles for a while, saves the tree, and the next stage resumes from it. A later run resumes from the newest saved
# tree for the same pin and GN args, and a run whose engine id matches an earlier artifact republishes it without
# compiling.
#
# Start a run: git tag android-engine-N && git push origin android-engine-N
on:
  workflow_dispatch:
  push:
    tags: ["android-engine-*"]

permissions:
  contents: read
  actions: read

concurrency:
  group: android-engine
  # Cancelling a stage mid-compile throws away its unsaved progress; let a running build finish.
  cancel-in-progress: false

jobs:
  stage-1:
    uses: ./.github/workflows/android-engine-stage.yml
    with:
      stage: 1
  stage-2:
    needs: stage-1
    uses: ./.github/workflows/android-engine-stage.yml
    with:
      stage: 2
  stage-3:
    needs: stage-2
    uses: ./.github/workflows/android-engine-stage.yml
    with:
      stage: 3
  stage-4:
    needs: stage-3
    uses: ./.github/workflows/android-engine-stage.yml
    with:
      stage: 4
  stage-5:
    needs: stage-4
    uses: ./.github/workflows/android-engine-stage.yml
    with:
      stage: 5
  stage-6:
    needs: stage-5
    uses: ./.github/workflows/android-engine-stage.yml
    with:
      stage: 6

  # Every stage can pause successfully, so a green stage proves nothing on its own: the run passes only when it
  # published the engine.
  engine:
    needs: stage-6
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the engine was published
        run: |
          if [[ "${{ needs.stage-6.result }}" != success ]]; then
            echo "::error::a stage failed or was skipped (stage-6: ${{ needs.stage-6.result }})"
            exit 1
          fi
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=android-engine" --jq .total_count)
          if (( count == 0 )); then
            echo "::error::six stages ran out before the engine finished; start another run to resume from the saved tree"
            exit 1
          fi

  # The app around the engine (apps/android): Gradle's release build, with the Rust core built by cargo-ndk. Signed
  # with the release key when the repository has one (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
  # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD); without it the APK gets a throwaway debug key, which installs from a link
  # but can't update a store build.
  apk:
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: android-engine
          path: dist/android-engine
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install the NDK and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" >/dev/null
          cargo install cargo-ndk --locked
      - name: Install the engine
        run: node apps/android/scripts/fetch-engine.mjs --from dist/android-engine
      # Each run's APK has a higher versionCode than the last, so it installs over an earlier one as an update.
      # Dexing Chromium's Java needs a bigger Gradle heap than the default.
      - name: Build
        working-directory: apps/android
        run: ./gradlew --no-daemon "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" -PbayVersionCode=$GITHUB_RUN_NUMBER :app:assembleRelease
      - name: Sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          built=apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
          version=$(sed -nE 's/^ *versionName = "(.*)"$/\1/p' apps/android/app/build.gradle.kts)
          apk="dist/Bay-$version-android.apk"
          mkdir -p dist
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [[ -z "$KEYSTORE" ]]; then
            echo "::warning::no release key in the repository secrets: the APK is signed with a throwaway debug key"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass android -keypass android \
              -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
            export KEYSTORE_PASSWORD=android KEY_ALIAS=androiddebugkey KEY_PASSWORD=android
          else
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          fi
          "$tools/zipalign" -f -p 16 "$built" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out "$apk" "$RUNNER_TEMP/aligned.apk"
          rm "$RUNNER_TEMP/release.jks"
          "$tools/apksigner" verify --print-certs "$apk"
          echo "APK=$apk" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: bay-android-apk
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 30
      # A tag publishes the APK, and the engine apps/android/engine-pin.json can pin, as a prerelease.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          id=$(node -p 'require("./dist/android-engine/engine.json").id')
          gh release create "$GITHUB_REF_NAME" "$APK" dist/android-engine/bay-engine.aar dist/android-engine/engine.json \
            --repo "$GITHUB_REPOSITORY" --prerelease --title "Bay for Android ($GITHUB_REF_NAME)" \
            --notes "Bay for Android with its own Chromium ($id). To build the app against this engine, pin it in apps/android/engine-pin.json: {\"id\": \"$id\", \"release\": \"https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME\"}"
