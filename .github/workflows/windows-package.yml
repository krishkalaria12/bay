name: Windows installer
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (three or four numeric components)
        required: true
      channel:
        description: Update channel
        type: choice
        options: [beta, stable]
        default: beta
      unsigned:
        description: Produce an unsigned installer for local testing
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    environment: windows-release
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Fetch verified engine
        env:
          BAY_ENGINE_URL: ${{ vars.BAY_WINDOWS_ENGINE_URL }}
          BAY_ENGINE_SHA256: ${{ vars.BAY_WINDOWS_ENGINE_SHA256 }}
        run: python scripts/windows/fetch-engine.py --url "$env:BAY_ENGINE_URL" --sha256 "$env:BAY_ENGINE_SHA256" --destination dist/windows-engine
      - name: Build
        run: python scripts/windows/build-app.py --engine dist/windows-engine --output dist/windows-app
      - name: Install packaging tools
        run: choco install innosetup --no-progress -y
      - name: Load release certificate
        if: ${{ !inputs.unsigned }}
        shell: pwsh
        env:
          BAY_SIGNING_PFX_BASE64: ${{ secrets.BAY_SIGNING_PFX_BASE64 }}
          BAY_SIGNING_PFX_PASSWORD: ${{ secrets.BAY_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:BAY_SIGNING_PFX_BASE64) { throw 'Configure the Windows release certificate secrets' }
          $pfx = Join-Path $env:RUNNER_TEMP 'bay-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:BAY_SIGNING_PFX_BASE64))
            $password = ConvertTo-SecureString $env:BAY_SIGNING_PFX_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            "BAY_SIGNING_CERT_SHA1=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          } finally { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }
      - name: Package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          UNSIGNED: ${{ inputs.unsigned }}
          BAY_WINDOWS_UPDATE_FEED: ${{ vars.BAY_WINDOWS_UPDATE_FEED }}
          BAY_WINDOWS_DOWNLOAD_BASE: ${{ vars.BAY_WINDOWS_DOWNLOAD_BASE }}
        run: |
          $parameters = @{ Version = $env:RELEASE_VERSION; Channel = $env:RELEASE_CHANNEL }
          if ($env:UNSIGNED -eq 'true') { $parameters.Unsigned = $true }
          $sdk = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin' -Directory | Sort-Object Name -Descending | Where-Object { Test-Path (Join-Path $_.FullName 'x64/signtool.exe') } | Select-Object -First 1
          if ($sdk) { $env:PATH = (Join-Path $sdk.FullName 'x64') + ';' + $env:PATH }
          & scripts/windows/package.ps1 @parameters
      - uses: actions/upload-artifact@v4
        with:
          name: bay-windows-installer-${{ inputs.version }}-${{ inputs.channel }}
          path: dist/windows/*
          if-no-files-found: error
      - name: Remove release certificate
        if: ${{ always() && !inputs.unsigned }}
        shell: pwsh
        run: |
          if ($env:BAY_SIGNING_CERT_SHA1) { Remove-Item "Cert:/CurrentUser/My/$env:BAY_SIGNING_CERT_SHA1" -Force -ErrorAction SilentlyContinue }
