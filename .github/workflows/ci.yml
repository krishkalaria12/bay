# Every push to main and every pull request: formatting, lint, types and the JavaScript tests, on Linux.
# The app itself needs the Chromium engine (a two-hour build), so CI checks its code without building it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Format (oxfmt)
        run: pnpm fmt:check
      - name: Lint (oxlint)
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      # The Swift suites run on macOS (swift.yml); here, every JavaScript suite.
      - name: Tests
        run: |
          pnpm turbo run test --filter=@bay/core --filter=@bay/browser
          pnpm --filter @bay/sync exec node --test "src/**/*.test.ts"
      - name: Engine freshness checks
        run: node --test scripts/tests/test-engine-fresh.mjs
      # The Android engine's build driver and the archive that resumes its runner stages (GNU tar and zstd here).
      - name: Android engine scripts
        run: python3 -m unittest scripts/android/test_engine.py scripts/lib/test_engine_state.py -v
      # Effect is the desktop app's: the shared packages, the other apps and the store stay free of it.
      - name: Effect boundary
        run: node --test scripts/tests/test-effect-boundary.mjs
      - name: React Compiler
        run: pnpm compiler:check
      - name: Rust content blocker
        run: |
          cargo fmt --check --manifest-path packages/adblock/Cargo.toml
          cargo test --locked --manifest-path packages/adblock/Cargo.toml

  content-blocker-native:
    name: Native content blocker
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Native state and download regression tests
        run: node packages/chromium/scripts/test-content-blocker.mjs

  # The mobile app is its own workspace with its own lockfile, so the root install never sees it: its types and its
  # tests need their own job, or a broken phone build only shows up on a phone.
  mobile:
    name: Mobile types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      # The app links @bay/core from the root workspace, so both installs are needed.
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: apps/mobile
      - name: Types
        run: pnpm typecheck
        working-directory: apps/mobile
      - name: Tests
        run: pnpm test
        working-directory: apps/mobile
