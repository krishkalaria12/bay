name: Linux desktop checks
on:
  pull_request:
  push:
    branches: [main, feat/linux]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm typecheck:web
      - run: pnpm build:web
      - name: Install native fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev libnss3-dev libglib2.0-dev rpm desktop-file-utils appstream
      - name: Run portable JavaScript tests
        run: |
          pnpm --filter @bay/core --filter @bay/platform --filter @bay/shaders --filter @bay/browser test
          pnpm --filter @bay/sync exec node --test 'src/**/*.test.ts'
      - name: Check WebGL shaders in Chromium
        run: CHROMIUM="$(command -v google-chrome || command -v chromium)" pnpm --filter @bay/shaders test:web
      - name: Test Linux sync services
        run: |
          python scripts/linux/test-import.py --services-only
          bash packages/sync/scripts/check-linux-crypto.sh
          python packages/sync/linux/tests/service-test.py
          python packages/sync/linux/tests/recovery-kit-test.py
      - name: Test patch routing and layer installation
        run: |
          python -m unittest discover -s engine/patches -p 'test_*.py' -v
          python -m unittest engine/chromium/test_apply.py -v
      - name: Test engine tooling
        run: |
          python -m unittest scripts/test_engine_driver.py -v
          python -m unittest discover -s scripts/windows -p 'test_*.py' -v
      - name: Validate Linux patch selection
        run: python engine/patches/series.py files --platform linux
      - name: Test Linux packaging
        run: |
          python -m unittest discover -s scripts/linux -p 'test_*.py' -v
