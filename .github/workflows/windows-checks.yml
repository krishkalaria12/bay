name: Windows desktop checks
on:
  pull_request:
  push:
    branches: [main, feat/windows]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: pnpm typecheck
      - run: pnpm typecheck:windows
      - run: pnpm test
      - run: python -m unittest discover -s scripts/windows -p 'test_*.py' -v
      - name: Validate Windows patch selection
        run: python engine/patches/series.py files --platform win
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem scripts/windows, packaging/windows -Filter '*.ps1' -Recurse | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
  app:
    # Configure these repository variables after publishing the first engine.
    if: ${{ vars.BAY_WINDOWS_ENGINE_URL != '' && vars.BAY_WINDOWS_ENGINE_SHA256 != '' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: microsoft/setup-msbuild@v2
      - run: pnpm install --frozen-lockfile
      - name: Fetch verified pinned engine
        env:
          BAY_ENGINE_URL: ${{ vars.BAY_WINDOWS_ENGINE_URL }}
          BAY_ENGINE_SHA256: ${{ vars.BAY_WINDOWS_ENGINE_SHA256 }}
        run: python scripts/windows/fetch-engine.py --url "$env:BAY_ENGINE_URL" --sha256 "$env:BAY_ENGINE_SHA256" --destination dist/windows-engine
      - name: Build desktop app
        run: pwsh -File apps/browser/windows/build.ps1 -Configuration Release -EngineDirectory "$pwd/dist/windows-engine"
      - name: Archive desktop app
        uses: actions/upload-artifact@v4
        with:
          name: bay-windows-x64
          path: apps/browser/windows/x64/Release/Bay/
          if-no-files-found: error
