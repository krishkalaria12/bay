name: Windows desktop checks
on:
  pull_request:
  push:
    branches: [main, feat/windows]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: pnpm typecheck
      - run: pnpm test
      - run: python -m unittest discover -s scripts/windows -p 'test_*.py' -v
      - name: Validate Windows patch selection
        run: python engine/patches/series.py files --platform win
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem scripts/windows, packaging/windows -Filter '*.ps1' -Recurse | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
