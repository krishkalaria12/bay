<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Bay</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family: "Bay UI", system-ui, sans-serif;
        /* The browser's own UI isn't text to select, as on macOS; fields and Text marked selectable still are. */
        user-select: none;
      }
      #root {
        display: flex;
        flex-direction: column;
        isolation: isolate;
      }
      input,
      textarea {
        outline: none;
      }
      input,
      textarea,
      [contenteditable]:not([contenteditable="false"]) {
        user-select: text;
      }
    </style>
    <script type="module" src="/bay-native-host.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
