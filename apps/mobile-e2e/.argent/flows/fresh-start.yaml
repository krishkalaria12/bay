# Launches Bay and clears all browsing data in Settings, so a test starts on an empty start page whatever the last
# run left open. Both apps are their debug builds (`…mobile.native`).
steps:
  - launch: { ios: in.krishkalaria.bay.mobile.native, android: in.krishkalaria.bay.mobile.native }
  - await: { idle: true, timeout: 15000 }
  - await: { idle: true, timeout: 60000, stableFor: 2000 }
  # A fresh install opens on the welcome. Skip ends it on the search field, which the next steps put away.
  - when: { visible: { id: welcome-skip } }
    steps:
      - tap: { id: welcome-skip }
      - await: { hidden: { id: welcome-skip }, timeout: 10000 }
      - await: { idle: true, timeout: 15000, stableFor: 1500 }
  # With "Open search when Bay starts" chosen (C1), Bay opens ready to type: put the search card away to reach the bar.
  - when: { visible: { id: search-dismiss } }
    steps:
      - tap: { id: search-dismiss }
      - await: { idle: true, timeout: 15000, stableFor: 1500 }
  # A reload that was still on its way opens it once more as the app starts again.
  - when: { visible: { id: search-dismiss } }
    steps:
      - tap: { id: search-dismiss }
      - await: { hidden: { id: search-dismiss }, timeout: 10000 }
  - await: { visible: { id: bar-search }, timeout: 60000 }
  - await: { idle: true, timeout: 15000 }
  # Bay asks for notifications at the first download; a run that stopped there leaves the system prompt over the app
  # at the next launch.
  - when: { visible: { text: "Allow" } }
    steps:
      - tap: { text: "Allow" }
      - await: { hidden: { text: "Allow" }, timeout: 10000 }
  # A restored tab can ask something as it loads again (a sign-in, an alert): turn it down.
  - when: { visible: { id: page-request-cancel } }
    steps:
      - tap: { id: page-request-cancel }
      - await: { hidden: { id: page-request-cancel }, timeout: 10000 }
  - when: { visible: { id: bar-more } }
    steps:
      - tap: { id: bar-more }
      - await: { visible: { id: page-menu-url }, timeout: 10000 }
      - await: { idle: true, timeout: 15000 }
      # Settings is the page menu's last row, below its fold.
      - scroll-to: { target: { id: page-settings }, direction: down }
      - tap: { id: page-settings }
  - when: { visible: { id: bar-settings } }
    steps:
      - tap: { id: bar-settings }
  - await: { visible: { id: settings-screen }, timeout: 10000 }
  - await: { idle: true, timeout: 15000 }
  # "Clear browsing data" is in Settings › Privacy.
  - tap: { id: settings-privacy }
  - await: { visible: { id: settings-clear-data }, timeout: 10000 }
  - await: { idle: true, timeout: 15000 }
  - tap: { id: settings-clear-data }
  - await: { visible: { id: clear-data-confirm }, timeout: 10000 }
  - await: { idle: true, timeout: 15000 }
  - tap: { id: clear-data-confirm }
  # Settings closes itself once the data is gone.
  - await: { hidden: { id: settings-screen-close }, timeout: 20000 }
  - await: { visible: { id: start-screen }, timeout: 10000 }
  - await: { idle: true, timeout: 15000 }
