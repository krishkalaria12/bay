# Cold start on both platforms (fresh-start launches the app): the start page shows its hint and the tabs, search and
# settings buttons.
steps:
  - run: ../flows/fresh-start
  - await: { visible: { text: Tap to search }, timeout: 10000 }
  - await: { visible: { id: bar-tabs }, timeout: 10000 }
  - await: { visible: { id: bar-search }, timeout: 10000 }
  - await: { visible: { id: bar-settings }, timeout: 10000 }
