# Launches Bay and clears all browsing data in Settings, so a test starts on an empty start page whatever the last
# run left open. Android's dev launcher needs the dev-client link before the app loads (see AGENTS.md).
steps:
  - launch: { ios: in.krishkalaria.bay.mobile, android: in.krishkalaria.bay.mobile }
  - await: { idle: true, timeout: 15000 }
  - when: { platform: android }
    steps:
      - tool: open-url
        args:
          url: exp+bay://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081
  - await: { visible: { id: bar-search }, timeout: 60000 }
  - await: { idle: true, timeout: 15000 }
  # Bay asks for notifications at the first download; a run that stopped there leaves the system prompt over the app
  # at the next launch.
  - when: { visible: { text: "Allow" } }
    steps:
      - tap: { text: "Allow" }
      - await: { hidden: { text: "Allow" }, timeout: 10000 }
  # A restored tab can ask something as it loads again (a sign-in, an alert): turn it down.
  - when: { visible: { id: page-request-cancel } }
    steps:
      - tap: { id: page-request-cancel }
      - await: { hidden: { id: page-request-cancel }, timeout: 10000 }
  # A fresh install opens on the welcome; tapping its glass dome lets Bay through.
  - when: { visible: { id: welcome-start } }
    steps:
      - tap: { id: welcome-start }
      - await: { hidden: { id: welcome-start }, timeout: 10000 }
  - when: { visible: { id: bar-more } }
    steps:
      - tap: { id: bar-more }
      - await: { visible: { id: page-settings }, timeout: 10000 }
      - tap: { id: page-settings }
  - when: { visible: { id: bar-settings } }
    steps:
      - tap: { id: bar-settings }
  - await: { visible: { id: settings-screen }, timeout: 10000 }
  - await: { idle: true, timeout: 15000 }
  # "Clear browsing data" sits below the fold of a phone-sized sheet, so scroll to it before tapping.
  - swipe: { from: { x: 0.5, y: 0.75 }, direction: up }
  - scroll-to: { target: { id: settings-clear-data } }
  - tap: { id: settings-clear-data }
  - await: { visible: { id: clear-data-confirm }, timeout: 10000 }
  - await: { idle: true, timeout: 15000 }
  - tap: { id: clear-data-confirm }
  # Settings closes itself once the data is gone.
  - await: { hidden: { id: settings-screen-close }, timeout: 20000 }
  - await: { visible: { id: start-screen }, timeout: 10000 }
  - await: { idle: true, timeout: 15000 }
