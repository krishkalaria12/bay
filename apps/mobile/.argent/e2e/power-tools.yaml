# Power tools: Find on page counts and steps through matches, and Inspect picks a paragraph, shows its font and goes
# to its parent. Needs network access to www.iana.org.
steps:
  - run: ../flows/fresh-start

  - tap: { id: start-screen }
  - await: { visible: { id: address-input }, timeout: 10000 }
  - type: { into: { id: address-input }, text: "www.iana.org/help/example-domains" }
  - await: { visible: { id: bar-more }, timeout: 30000 }
  - await: { hidden: { id: page-progress }, timeout: 30000 }
  # A tap on More while the page is still settling can be dropped, so wait until the screen holds still.
  - await: { idle: true, stableFor: 1500, timeout: 30000 }

  # Find on page: count, step forward and back, no matches, done.
  - tap: { id: bar-more }
  - await: { text: { in: { id: page-menu-url }, contains: "iana.org/help/example-domains" }, timeout: 10000 }
  - tap: { id: page-find }
  - await: { visible: { id: find-input }, timeout: 10000 }
  # iOS: keys typed while the keyboard is still rising under the find bar get dropped ("dmain"), so let it settle.
  - when: { platform: ios }
    steps:
      - await: { idle: true, timeout: 15000 }
  - type: { into: { id: find-input }, text: "domain" }
  - await: { text: { in: { id: find-count }, contains: "1 of" }, timeout: 10000 }
  - tap: { id: find-next }
  - await: { text: { in: { id: find-count }, contains: "2 of" }, timeout: 10000 }
  - tap: { id: find-previous }
  - await: { text: { in: { id: find-count }, contains: "1 of" }, timeout: 10000 }
  - type: { into: { id: find-input }, text: "zzq" }
  - await: { text: { in: { id: find-count }, contains: "No matches" }, timeout: 10000 }
  - tap: { id: find-done }
  - await: { hidden: { id: find-bar }, timeout: 10000 }
  - await: { visible: { id: bar-more }, timeout: 10000 }
  - await: { idle: true, timeout: 15000 }

  # Inspect: pick the first paragraph, read its details, go to its parent, done.
  - tap: { id: bar-more }
  - await: { visible: { id: page-more-tools }, timeout: 10000 }
  - tap: { id: page-more-tools }
  - await: { visible: { id: page-inspect }, timeout: 10000 }
  - tap: { id: page-inspect }
  - await: { text: { in: { id: inspect-instructions }, contains: "Tap an element" }, timeout: 20000 }
  - await: { idle: true, timeout: 15000 }
  # Android's tree has the page's text; iOS's runner tree has no web content, so it taps the paragraph where IANA's
  # layout puts it on the iPhone 18 Pro.
  - when: { platform: android }
    steps:
      - tap: { text: "A number of domains such as" }
  - when: { platform: ios }
    steps:
      - tap: { x: 0.5, y: 0.44 }
  - await: { visible: { id: inspect-open }, timeout: 10000 }
  - tap: { id: inspect-open }
  - await: { text: { in: { id: inspect-name }, contains: "p" }, timeout: 10000 }
  - await: { visible: { id: inspect-font }, timeout: 10000 }
  - await: { idle: true, timeout: 15000 }
  - tap: { id: inspect-parent }
  - await: { text: { in: { id: inspect-name }, contains: "div" }, timeout: 10000 }
  - tap: { id: inspect-copy }
  - await: { text: { in: { id: reading-notice }, contains: "Copied for a coding agent" }, timeout: 10000 }
  - tap: { id: inspect-panel-close }
  - await: { hidden: { id: inspect-panel }, timeout: 10000 }
  - tap: { id: inspect-done }
  - await: { hidden: { id: inspect-instructions }, timeout: 10000 }
