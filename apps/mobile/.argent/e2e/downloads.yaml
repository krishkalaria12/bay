# Downloads: a file the browser can't show downloads with a toast, appears first in Downloads and leaves the list when
# removed or cleared. Needs network access to proof.ovh.net (a 1 MB test file served as application/octet-stream).
steps:
  - run: ../flows/fresh-start

  - tap: { id: start-screen }
  - await: { visible: { id: address-input }, timeout: 10000 }
  - type: { into: { id: address-input }, text: "proof.ovh.net/files/1Mb.dat" }
  - await: { visible: { id: download-toast }, timeout: 30000 }
  # Both apps ask for notifications when the first download starts; the prompt would sit over the app.
  - when: { visible: { text: "Allow" } }
    steps:
      - tap: { text: "Allow" }
  # The file is checked in Downloads, opened from Settings. The toast also opens it, but it animates while the file
  # comes in and hides six seconds after, and on the emulator it was often gone between the runner finding it and the
  # tap landing. Clearing browsing data keeps the list, so earlier runs' files may follow the newest.
  - tap: { id: bar-settings }
  - await: { visible: { id: settings-screen }, timeout: 10000 }
  - await: { idle: true, timeout: 15000 }
  - swipe: { from: { x: 0.5, y: 0.75 }, direction: up }
  - scroll-to: { target: { id: settings-downloads } }
  - tap: { id: settings-downloads }
  - await: { visible: { id: downloads-panel }, timeout: 10000 }
  - await: { idle: true, timeout: 15000 }
  - await: { text: { in: { id: download-0 }, contains: "1Mb" }, timeout: 10000 }
  # A finished download shows its size and a Remove button (one still downloading shows Cancel).
  - await: { text: { in: { id: download-0-status }, equals: "1.0 MB" }, timeout: 60000 }
  - await: { visible: { id: download-0-remove }, timeout: 10000 }
  - tap: { id: download-0-remove }
  - await: { idle: true, timeout: 15000 }
  - when: { visible: { id: downloads-clear } }
    steps:
      - tap: { id: downloads-clear }
  - await: { visible: { id: downloads-empty }, timeout: 10000 }
  - tap: { id: downloads-panel-close }
  - await: { hidden: { id: downloads-panel }, timeout: 10000 }
  # The navigation that became a download isn't an error and doesn't keep loading: the tab is back on the start page.
  # (Checked once Downloads is closed: an open sheet hides what is behind it from the tree.)
  - await: { visible: { id: start-screen }, timeout: 10000 }
  - assert: { hidden: { id: navigation-error } }
  - assert: { hidden: { id: page-progress } }
