# Mini player: audio playing in a tab that's off screen shows a mini player that pauses, plays, goes back to the tab
# and stops. Needs network access to www.soundhelix.com (a six-minute MP3 opened as its own document), and on Android an
# emulator with audio: one booted with -no-audio (Argent's default) can't play it (boot-device with sound: true).
steps:
  - run: ../flows/fresh-start

  - tap: { id: start-screen }
  - await: { visible: { id: address-input }, timeout: 10000 }
  - type: { into: { id: address-input }, text: "www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" }
  - await: { visible: { id: bar-more }, timeout: 30000 }
  # Play in the media document's own controls, tapped where each engine puts them on its phone: Chrome's big play
  # button in the middle of the Pixel 9, WebKit's control bar across the middle of the iPhone 18 Pro with Play at its
  # left. Both wait for Play first: Android's tree lists the page's controls; iOS's runner tree has no web content, so
  # it asks the accessibility service, which reads WebKit's controls. (Reading Android's tree again while the controls
  # spin can time out, hence the tap by point there too.)
  - when: { platform: android }
    steps:
      - await: { visible: { text: "Play" }, timeout: 30000 }
      - tap: { x: 0.5, y: 0.517 }
  - when: { platform: ios }
    steps:
      - tool: await-ui-element
        args: { condition: visible, selector: { text: "Play", role: "button" }, timeoutMs: 30000 }
      - tap: { x: 0.078, y: 0.54 }
  - await: { idle: true, timeout: 15000 }

  # Off screen in the tab switcher, the tab's audio shows in the mini player under its file name.
  - tap: { id: bar-tabs }
  - await: { text: { in: { id: mini-player }, contains: "SoundHelix-Song-1.mp3, playing" }, timeout: 10000 }
  - tap: { id: mini-player-toggle }
  - await: { text: { in: { id: mini-player }, contains: "paused" }, timeout: 10000 }
  - tap: { id: mini-player-toggle }
  - await: { text: { in: { id: mini-player }, contains: "playing" }, timeout: 10000 }

  # Tapping it goes back to the tab, where the page's own controls take over.
  - tap: { id: mini-player }
  - await: { hidden: { id: mini-player }, timeout: 10000 }
  - await: { visible: { id: bar-more }, timeout: 10000 }
  - await: { idle: true, timeout: 15000 }

  # Stop pauses it and the mini player stays gone.
  - tap: { id: bar-tabs }
  - await: { visible: { id: mini-player }, timeout: 10000 }
  - tap: { id: mini-player-close }
  - await: { hidden: { id: mini-player }, timeout: 10000 }
  - await: { idle: true, stableFor: 2000, timeout: 15000 }
  - await: { hidden: { id: mini-player }, timeout: 1000 }

  # Archive the tab: a media file left open reloads at the next launch, and while its controls spin, reading
  # Android's tree times out.
  - tap: { id: tab-card-0 }
  - await: { visible: { id: bar-more }, timeout: 10000 }
  - tap: { id: bar-more }
  - await: { visible: { id: page-close-tab }, timeout: 10000 }
  - await: { idle: true, timeout: 15000 }
  - tap: { id: page-close-tab }
  - await: { visible: { id: start-screen }, timeout: 10000 }
