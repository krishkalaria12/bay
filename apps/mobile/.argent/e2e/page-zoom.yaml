# Page zoom: Bay's zoom applies to every page. The sheet's value, the row behind it and the site's own panel all
# say the same zoom, and the page's own geometry is read back from the page with Inspect: the paragraph the picker
# picked is drawn taller once the zoom is up.
# Needs network access to www.iana.org.
steps:
  - run: ../flows/fresh-start

  # A page with a paragraph to measure.
  - tap: { id: start-screen }
  - await: { visible: { id: address-input }, timeout: 10000 }
  - type: { into: { id: address-input }, text: "www.iana.org/help/example-domains" }
  - await: { visible: { id: bar-more }, timeout: 30000 }
  - await: { hidden: { id: page-progress }, timeout: 30000 }
  - await: { idle: true, stableFor: 1500, timeout: 30000 }

  # Measure the paragraph as the page draws it now: Inspect reads the page's own geometry.
  - tap: { id: bar-more }
  - await: { visible: { id: page-more-tools }, timeout: 10000 }
  - tap: { id: page-more-tools }
  - await: { visible: { id: page-inspect }, timeout: 10000 }
  - tap: { id: page-inspect }
  - await: { text: { in: { id: inspect-instructions }, contains: "Tap an element" }, timeout: 20000 }
  - await: { idle: true, timeout: 15000 }
  # Android's tree has the page's text; iOS's runner tree has no web content, so it taps the paragraph where IANA's
  # layout puts it on the iPhone 18 Pro.
  - when: { platform: android }
    steps:
      - tap: { text: "A number of domains such as" }
  - when: { platform: ios }
    steps:
      - tap: { x: 0.5, y: 0.44 }
  - await: { visible: { id: inspect-open }, timeout: 10000 }
  - tap: { id: inspect-open }
  - await: { text: { in: { id: inspect-name }, contains: "p" }, timeout: 10000 }
  # The size the page draws that paragraph at, in CSS pixels. At 100% it is a handful of lines of text.
  - await: { text: { in: { id: inspect-size }, matches: '^\d+ × \d+$' }, timeout: 10000 }

  # Close the panel. The picker stays open with the paragraph picked, so it can be measured again.
  - tap: { id: inspect-panel-close }
  - await: { hidden: { id: inspect-panel }, timeout: 10000 }

  # The zoom lives in Settings, under Appearance.
  - tap: { id: bar-more }
  - await: { visible: { id: page-settings }, timeout: 10000 }
  - tap: { id: page-settings }
  - await: { visible: { id: settings-screen }, timeout: 10000 }
  - await: { idle: true, timeout: 15000 }
  - tap: { id: settings-appearance }
  - await: { visible: { id: settings-text-size }, timeout: 10000 }
  - tap: { id: settings-text-size }
  - await: { visible: { id: text-size-value }, timeout: 10000 }
  # A run that stopped half way could have left the zoom changed: "Back to 100%" is there only when it is.
  - when: { visible: { id: text-size-reset } }
    steps:
      - tap: { id: text-size-reset }
      - await: { idle: true, timeout: 10000 }
  - await: { text: { in: { id: text-size-value }, equals: "100%" }, timeout: 10000 }
  # Ten steps up is 200%, the largest zoom there is.
  - tap: { id: text-size-larger }
  - tap: { id: text-size-larger }
  - tap: { id: text-size-larger }
  - tap: { id: text-size-larger }
  - tap: { id: text-size-larger }
  - tap: { id: text-size-larger }
  - tap: { id: text-size-larger }
  - tap: { id: text-size-larger }
  - tap: { id: text-size-larger }
  - tap: { id: text-size-larger }
  - await: { text: { in: { id: text-size-value }, equals: "200%" }, timeout: 10000 }
  # The row behind says the same zoom.
  - tap: { id: settings-screen-back }
  - await: { text: { in: { id: settings-text-size-value }, equals: "200%" }, timeout: 10000 }
  - tap: { id: settings-screen-close }
  - await: { hidden: { id: settings-screen-close }, timeout: 10000 }

  # The page follows Bay's zoom: the site's own panel says which zoom the page is at.
  - tap: { id: bar-more }
  - await: { visible: { id: page-site-settings }, timeout: 10000 }
  - tap: { id: page-site-settings }
  - await: { visible: { id: site-text-size }, timeout: 10000 }
  - await: { text: { in: { id: site-text-size-detail }, contains: "Follows Bay's 200%" }, timeout: 10000 }
  - tap: { id: site-settings-close }
  - await: { hidden: { id: site-settings }, timeout: 10000 }

  # And the page really is drawn at the new zoom: the same paragraph, measured again, is much taller.
  - tap: { id: inspect-open }
  - await: { visible: { id: inspect-panel }, timeout: 10000 }
  - await: { text: { in: { id: inspect-name }, contains: "p" }, timeout: 10000 }
  - await: { text: { in: { id: inspect-size }, matches: '^\d+ × (?:1[5-9]\d|[2-9]\d\d|\d{4,})$' }, timeout: 10000 }

  # Put the zoom back, so the next run starts as it did.
  - tap: { id: inspect-panel-close }
  - await: { hidden: { id: inspect-panel }, timeout: 10000 }
  - tap: { id: bar-more }
  - await: { visible: { id: page-settings }, timeout: 10000 }
  - tap: { id: page-settings }
  - await: { visible: { id: settings-screen }, timeout: 10000 }
  - await: { idle: true, timeout: 15000 }
  - tap: { id: settings-appearance }
  - await: { visible: { id: settings-text-size }, timeout: 10000 }
  - tap: { id: settings-text-size }
  - await: { visible: { id: text-size-value }, timeout: 10000 }
  - tap: { id: text-size-reset }
  - await: { idle: true, timeout: 10000 }
  - await: { text: { in: { id: text-size-value }, equals: "100%" }, timeout: 10000 }
  - tap: { id: settings-screen-close }
  - await: { hidden: { id: settings-screen-close }, timeout: 10000 }
  # And leave the element picker, still open from the measuring.
  - await: { visible: { id: inspect-done }, timeout: 10000 }
  - tap: { id: inspect-done }
  - await: { hidden: { id: inspect-instructions }, timeout: 10000 }
