# Bookmarks and the import sheet: a page bookmarked from its menu shows in Bookmarks and goes again with its remove
# button; an empty Bookmarks sheet offers the import, which lists the ways in and walks through a bookmarks file
# (the system's file picker is the phone's own and isn't driven here); a pasted list of tabs goes to the archive.
#
# The page is .argent/pages/second.html, served by Metro (which both devices reach at 127.0.0.1:8081), so the test
# needs no network. The pasted links are never opened: they go to the archive.
steps:
  - run: ../flows/fresh-start
  - tap: { id: start-screen }
  - await: { visible: { id: address-input }, timeout: 10000 }
  - type: { into: { id: address-input }, text: "127.0.0.1:8081/assets/.argent/pages/second.html" }
  - await: { visible: { id: bar-more }, timeout: 30000 }
  - await: { hidden: { id: page-progress }, timeout: 30000 }
  - await: { idle: true, timeout: 15000 }

  # Bookmark the page from its menu; the toast's Show opens Bookmarks with it in.
  - tap: { id: bar-more }
  - await: { visible: { id: page-bookmark }, timeout: 10000 }
  - tap: { id: page-bookmark }
  - await: { visible: { id: toast-action }, timeout: 10000 }
  - tap: { id: toast-action }
  - await: { visible: { id: bookmarks-screen-close }, timeout: 10000 }
  - await: { visible: { id: "bookmark-open-http://127.0.0.1:8081/assets/.argent/pages/second.html" }, timeout: 10000 }

  # Remove it: the sheet is empty, and offers the import.
  - tap: { id: "bookmark-remove-http://127.0.0.1:8081/assets/.argent/pages/second.html" }
  - await: { visible: { id: bookmarks-empty }, timeout: 10000 }
  - await: { idle: true, timeout: 10000 }
  - tap: { id: bookmarks-import }
  - await: { visible: { id: import-browser-other }, timeout: 10000 }
  - await: { visible: { id: import-passwords }, timeout: 10000 }
  - await: { idle: true, timeout: 10000 }

  # A bookmarks file: the steps and the button that opens the phone's file picker.
  - tap: { id: import-browser-other }
  - await: { visible: { id: import-guide }, timeout: 10000 }
  - await: { visible: { id: import-choose }, timeout: 10000 }
  - tap: { id: import-screen-back }
  - await: { visible: { id: import-paste-tabs }, timeout: 10000 }
  - await: { idle: true, timeout: 10000 }

  # A pasted list of tabs: the links are found and archived, not opened.
  - tap: { id: import-paste-tabs }
  - await: { visible: { id: import-text }, timeout: 10000 }
  - type: { into: { id: import-text }, text: "Bay one https://bay.example/one and https://bay.example/two" }
  - await: { text: { in: { id: import-count }, equals: "2 links found" }, timeout: 10000 }
  - tap: { id: import-archive }
  - await: { hidden: { id: import-text }, timeout: 10000 }
  - await: { visible: { text: "Archived 2 tabs" }, timeout: 10000 }
