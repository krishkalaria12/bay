# YouTube cleanup: the three switches under Browsing, and Hide Shorts proved on YouTube itself: the Shorts tab in
# m.youtube.com's bottom bar goes away while it's on and is back once it's off. Needs network access to youtube.com.
#
# Android's tree has the page's content, so it checks the Shorts tab; iOS's runner tree has no web content, so there
# the test only flips the switches and puts them back. A switch's state is not in the tree on either platform, so a run
# that stopped half way can leave the switches on: turn them off in Settings before the next run.
steps:
  - run: ../flows/fresh-start

  - tap: { id: start-screen }
  - await: { visible: { id: address-input }, timeout: 10000 }
  - type: { into: { id: address-input }, text: "m.youtube.com" }
  - await: { visible: { id: bar-more }, timeout: 30000 }
  - await: { hidden: { id: page-progress }, timeout: 30000 }
  - await: { idle: true, timeout: 15000 }
  - when: { platform: android }
    steps:
      - await: { visible: { text: "Shorts" }, timeout: 30000 }

  # Turn all three on, from the page's own menu.
  - tap: { id: bar-more }
  - await: { visible: { id: page-settings }, timeout: 10000 }
  - await: { idle: true, timeout: 15000 }
  - tap: { id: page-settings }
  - await: { visible: { id: settings-screen }, timeout: 10000 }
  - await: { idle: true, timeout: 15000 }
  - tap: { id: settings-browsing }
  - await: { visible: { id: settings-yt-shorts }, timeout: 10000 }
  - await: { visible: { id: settings-yt-suggestions }, timeout: 10000 }
  - await: { visible: { id: settings-yt-distractions }, timeout: 10000 }
  - tap: { id: settings-yt-shorts }
  - tap: { id: settings-yt-suggestions }
  - tap: { id: settings-yt-distractions }
  - await: { idle: true, timeout: 10000 }
  - tap: { id: settings-screen-close }
  - await: { hidden: { id: settings-screen-close }, timeout: 10000 }
  - await: { idle: true, timeout: 15000 }

  # The page loses its Shorts tab straight away, without a reload.
  - when: { platform: android }
    steps:
      - await: { hidden: { text: "Shorts" }, timeout: 15000 }
      - assert: { visible: { text: "Home" } }

  # Turn them off again.
  - tap: { id: bar-more }
  - await: { visible: { id: page-settings }, timeout: 10000 }
  - await: { idle: true, timeout: 15000 }
  - tap: { id: page-settings }
  - await: { visible: { id: settings-screen }, timeout: 10000 }
  - await: { idle: true, timeout: 15000 }
  - tap: { id: settings-browsing }
  - await: { visible: { id: settings-yt-shorts }, timeout: 10000 }
  - tap: { id: settings-yt-shorts }
  - tap: { id: settings-yt-suggestions }
  - tap: { id: settings-yt-distractions }
  - await: { idle: true, timeout: 10000 }
  - tap: { id: settings-screen-close }
  - await: { hidden: { id: settings-screen-close }, timeout: 10000 }
  - await: { idle: true, timeout: 15000 }

  # The tab is back on screen at once, but Android's WebView only puts it back in its accessibility tree when the page
  # loads again, so reload before checking.
  - tap: { id: bar-more }
  - await: { visible: { id: page-reload }, timeout: 10000 }
  - await: { idle: true, timeout: 15000 }
  - tap: { id: page-reload }
  - await: { hidden: { id: page-menu-url }, timeout: 10000 }
  - await: { hidden: { id: page-progress }, timeout: 30000 }
  - when: { platform: android }
    steps:
      - await: { visible: { text: "Shorts" }, timeout: 30000 }
