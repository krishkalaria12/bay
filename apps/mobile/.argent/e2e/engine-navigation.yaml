# Recorded on Android; the same selectors run on iOS. Requires Metro on port 8081.
steps:
  - launch: { ios: in.krishkalaria.bay.mobile, android: in.krishkalaria.bay.mobile }
  - await: { idle: true, timeout: 15000 }
  - when: { platform: android }
    steps:
      - tool: open-url
        args:
          url: exp+bay://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081
  - await: { visible: { text: Tap to search }, timeout: 60000 }
  - await: { idle: true, timeout: 15000 }
  - tap: { id: start-search }
  - await: { visible: { id: address-input }, timeout: 10000 }
  - await: { idle: true, timeout: 15000 }
  - type: { into: { id: address-input }, text: "https://example.com" }
  - await: { text: { in: { id: page-title }, equals: Example Domain }, timeout: 30000 }
  - await: { text: { in: { id: page-url }, equals: "https://example.com/" }, timeout: 30000 }
  - await: { idle: true, timeout: 15000 }
  - await: { text: { in: { id: page-status }, equals: Ready }, timeout: 30000 }
  - tap: { id: browser-search }
  - await: { visible: { id: clear-address }, timeout: 15000 }
  - await: { idle: true, timeout: 15000 }
  - tap: { id: clear-address }
  - await: { hidden: { id: clear-address }, timeout: 10000 }
  - type: { into: { id: address-input }, text: "https://example.org" }
  - await: { text: { in: { id: page-url }, equals: "https://example.org/" }, timeout: 30000 }
  - await: { idle: true, timeout: 15000 }
  - await: { text: { in: { id: page-status }, equals: Ready }, timeout: 30000 }
  - tap: { id: browser-back }
  - await: { text: { in: { id: page-url }, equals: "https://example.com/" }, timeout: 15000 }
  - await: { idle: true, timeout: 15000 }
  - tap: { id: browser-forward }
  - await: { text: { in: { id: page-url }, equals: "https://example.org/" }, timeout: 15000 }
  - await: { idle: true, timeout: 15000 }
  - tap: { id: browser-reload }
  - await: { text: { in: { id: page-title }, equals: Example Domain }, timeout: 15000 }
  - await: { text: { in: { id: page-status }, equals: Ready }, timeout: 15000 }
