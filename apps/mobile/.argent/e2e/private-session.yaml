# Private session: a private tab keeps its cookies while newer tabs push its page view out (only four stay mounted),
# and closing the last private tab ends the session, so the next private tab starts without them.
# The page's cookie is read with Find on page, whose count is Bay's own UI (the iOS runner can't see page text). Its
# value repeats one letter, so a key the simulator drops or reorders still finds it.
# Needs network access to example.com, example.org, example.net and httpbin.org.
steps:
  - run: ../flows/fresh-start
  - tap: { id: start-screen }
  - await: { visible: { id: address-input }, timeout: 10000 }
  - type: { into: { id: address-input }, text: "example.com" }
  - await: { visible: { id: bar-tabs }, timeout: 30000 }
  - await: { idle: true, timeout: 15000 }

  # A private tab sets a cookie.
  - tap: { id: bar-tabs }
  - await: { visible: { id: tab-card-0 }, timeout: 10000 }
  - tap: { id: bar-search }
  - await: { visible: { id: private-toggle }, timeout: 10000 }
  - tap: { id: private-toggle }
  - await: { visible: { id: private-notice }, timeout: 10000 }
  - type: { into: { id: address-input }, text: "https://httpbin.org/cookies/set?bay=zzzzzz" }
  - await: { visible: { id: bar-tabs }, timeout: 30000 }
  - await: { idle: true, timeout: 15000 }
  - tap: { id: bar-more }
  - await: { text: { in: { id: page-menu-url }, contains: "httpbin.org/cookies" }, timeout: 30000 }
  - tap: { id: page-find }
  - await: { visible: { id: find-input }, timeout: 10000 }
  # iOS: keys typed while the keyboard is still rising under the find bar get dropped, so let it settle.
  - when: { platform: ios }
    steps:
      - await: { idle: true, timeout: 15000 }
  - type: { into: { id: find-input }, text: "zzzz" }
  - await: { text: { in: { id: find-count }, contains: "1 of" }, timeout: 10000 }
  - tap: { id: find-done }
  - await: { hidden: { id: find-bar }, timeout: 10000 }

  # Four newer tabs leave the private tab's page unmounted.
  - tap: { id: bar-more }
  - await: { visible: { id: page-new-tab }, timeout: 10000 }
  - tap: { id: page-new-tab }
  - await: { visible: { id: address-input }, timeout: 10000 }
  - type: { into: { id: address-input }, text: "example.org" }
  - await: { visible: { id: bar-tabs }, timeout: 30000 }
  - await: { idle: true, timeout: 15000 }
  - tap: { id: bar-more }
  - await: { visible: { id: page-new-tab }, timeout: 10000 }
  - tap: { id: page-new-tab }
  - await: { visible: { id: address-input }, timeout: 10000 }
  - type: { into: { id: address-input }, text: "example.net" }
  - await: { visible: { id: bar-tabs }, timeout: 30000 }
  - await: { idle: true, timeout: 15000 }
  - tap: { id: bar-more }
  - await: { visible: { id: page-new-tab }, timeout: 10000 }
  - tap: { id: page-new-tab }
  - await: { visible: { id: address-input }, timeout: 10000 }
  - type: { into: { id: address-input }, text: "https://example.com/?tab=4" }
  - await: { visible: { id: bar-tabs }, timeout: 30000 }
  - await: { idle: true, timeout: 15000 }
  - tap: { id: bar-more }
  - await: { visible: { id: page-new-tab }, timeout: 10000 }
  - tap: { id: page-new-tab }
  - await: { visible: { id: address-input }, timeout: 10000 }
  - type: { into: { id: address-input }, text: "https://example.org/?tab=5" }
  - await: { visible: { id: bar-tabs }, timeout: 30000 }
  - await: { idle: true, timeout: 15000 }

  # Back in the private tab, its page loads again in the same session.
  - tap: { id: bar-tabs }
  - await: { visible: { id: tab-switcher-count }, timeout: 10000 }
  - scroll-to: { target: { id: tab-private-1 }, direction: left }
  - tap: { id: tab-card-1 }
  - await: { hidden: { id: tab-switcher-count }, timeout: 10000 }
  - await: { idle: true, timeout: 15000 }
  - tap: { id: bar-more }
  - await: { text: { in: { id: page-menu-url }, contains: "httpbin.org/cookies" }, timeout: 30000 }
  - tap: { id: page-find }
  - await: { visible: { id: find-input }, timeout: 10000 }
  # iOS: keys typed while the keyboard is still rising under the find bar get dropped, so let it settle.
  - when: { platform: ios }
    steps:
      - await: { idle: true, timeout: 15000 }
  - type: { into: { id: find-input }, text: "zzzz" }
  - await: { text: { in: { id: find-count }, contains: "1 of" }, timeout: 10000 }
  - tap: { id: find-done }
  - await: { hidden: { id: find-bar }, timeout: 10000 }

  # Closing the last private tab ends the session.
  - tap: { id: bar-tabs }
  - await: { visible: { id: tab-switcher-count }, timeout: 10000 }
  - scroll-to: { target: { id: tab-private-1 }, direction: left }
  - tap: { id: tab-close-1 }
  - await: { hidden: { id: tab-private-1 }, timeout: 10000 }
  - tap: { id: bar-search }
  - await: { visible: { id: private-toggle }, timeout: 10000 }
  - tap: { id: private-toggle }
  - await: { visible: { id: private-notice }, timeout: 10000 }
  - type: { into: { id: address-input }, text: "https://httpbin.org/cookies" }
  - await: { visible: { id: bar-tabs }, timeout: 30000 }
  - await: { idle: true, timeout: 15000 }
  - tap: { id: bar-more }
  - await: { text: { in: { id: page-menu-url }, contains: "httpbin.org/cookies" }, timeout: 30000 }
  - tap: { id: page-find }
  - await: { visible: { id: find-input }, timeout: 10000 }
  # iOS: keys typed while the keyboard is still rising under the find bar get dropped, so let it settle.
  - when: { platform: ios }
    steps:
      - await: { idle: true, timeout: 15000 }
  # The page is there, with no cookie in it.
  - type: { into: { id: find-input }, text: "cookies" }
  - await: { text: { in: { id: find-count }, contains: "1 of" }, timeout: 10000 }
  - type: { into: { id: find-input }, text: "zzzz" }
  - await: { text: { in: { id: find-count }, contains: "No matches" }, timeout: 10000 }
  - tap: { id: find-done }
  - await: { hidden: { id: find-bar }, timeout: 10000 }
